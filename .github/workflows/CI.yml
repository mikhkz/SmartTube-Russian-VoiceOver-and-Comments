name: Build SmartTube VOT

on:
  push:
    branches: [vot]
  pull_request:
    branches: [vot]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          submodules: recursive
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Android SDK tools
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: ''
          log-accepted-android-sdk-licenses: 'false'
      - name: Prepare Android SDK
        run: |
          sdkmanager 'platforms;android-34' 'build-tools;30.0.3'
          printf 'sdk.dir=%s\n' "${ANDROID_SDK_ROOT:-$ANDROID_HOME}" > local.properties
      - name: Build VOT and test native integration
        run: >-
          bash gradlew --no-daemon --max-workers=2
          :smarttubetv:assembleStvotDebug
          :common:testStstableDebugUnitTest
          --tests 'com.liskovsoft.smartyoutubetv2.common.vot.*'
      - name: Upload development APKs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: SmartTube-VOT-development
          path: smarttubetv/build/outputs/apk/stvot/debug/*.apk
          if-no-files-found: error
          retention-days: 7
